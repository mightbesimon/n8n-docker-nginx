services:
  n8n:
    image: n8nio/n8n:2.3.5
    container_name: n8n
    restart: unless-stopped
    ports:
      - 5678:5678
    environment:
      # security and privacy, and reduce network traffic
      - N8N_DIAGNOSTICS_ENABLED=false # disable telemetry collection
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true

      # domain
      - N8N_PROXY_HOPS=1 # required when running behind a reverse proxy
      - N8N_HOST=n8n.mightbesimon.com
      - WEBHOOK_URL=https://n8n.mightbesimon.com/
      - N8N_EDITOR_BASE_URL=https://n8n.mightbesimon.com/
      - WEBHOOK_TUNNEL_URL=https://n8n.mightbesimon.com/

      # timezone for scheduler, database, logs
      - GENERIC_TIMEZONE=Europe/Paris # set n8n timezone
      - TZ=Europe/Paris # set container timezone

      # executions data pruning
      - DB_SQLITE_VACUUM_ON_STARTUP=true # vacuum pruned disk space
      - EXECUTIONS_DATA_MAX_AGE=336 # keep for 2 week [ 168hr=7d / 336hr=14d ]
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=100 # keep only newest 100
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all # do not usually error so might as well keep
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all # set to false to reduce database size
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=false # set to true save node execution progress for debugging
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=false # too much data during testing

      # file handling
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem # store on disk instead of in memory to avoid large files crashing

      # metrics
      - N8N_METRICS=true # enable Prometheus metrics
      - N8N_METRICS_INCLUDE_CACHE_METRICS=true
      - N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS=true
      - N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL=true
      - N8N_METRICS_INCLUDE_NODE_TYPE_LABEL=true
      - N8N_METRICS_INCLUDE_CREDENTIAL_TYPE_LABEL=true
      - N8N_METRICS_INCLUDE_QUEUE_METRICS=true

    volumes:
      - n8n_volume:/home/node/.n8n
    networks:
      - n8n_network

volumes:
  n8n_volume:
    driver: local

networks:
  n8n_network:
    driver: bridge
